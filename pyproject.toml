[project]
name = "second-opinion"
version = "0.1.0"
description = "A first-pass review of an Oracle AWR or Statspack report, on your own machine, with a local open model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["beautifulsoup4", "lxml", "httpx"]

[project.optional-dependencies]
tracing = ["sentry-sdk>=2.0"]
lab = ["oracledb>=2.0"]
dev = ["pytest"]

[project.scripts]
second-opinion = "second_opinion.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["second_opinion"]
